services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edyeco}
      POSTGRES_USER: ${POSTGRES_USER:-edyeco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}
    volumes:
      - edyeco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-edyeco} -d ${POSTGRES_DB:-edyeco}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Non exposé sur Internet : le site parle à la base via le réseau Docker.
    expose:
      - '5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgres://${POSTGRES_USER:-edyeco}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edyeco}
      DB_SSL: 'false'
      DB_AUTO_MIGRATE: 'true'
      DB_AUTO_SEED: 'true'
      SITE_URL: ${SITE_URL:-http://localhost:4000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
      JWT_SECRET: ${JWT_SECRET:?Renseignez JWT_SECRET (32 caractères minimum) dans .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@edyeco.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Renseignez ADMIN_PASSWORD dans .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur EdyEco}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-EdyEco <contact@edyeco.fr>}
      MAIL_TO: ${MAIL_TO:-contact@edyeco.fr}
    ports:
      - '4000:4000'
    volumes:
      - edyeco_uploads:/app/server/uploads

volumes:
  edyeco_pgdata:
  edyeco_uploads:
